<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Notify Dr. Latsky — Patient Ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8D5A3;
      --gold-dim: #8a6f30;
      --charcoal: #1C1C1E;
      --charcoal-mid: #2C2C2E;
      --charcoal-light: #3A3A3C;
      --ivory: #F5F0E8;
      --alert-red: #E05C5C;
      --alert-green: #5CB87A;
      --text-dim: #9A9087;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--charcoal);
      color: var(--ivory);
      min-height: 100vh;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 28px;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      text-align: center;
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 6px 0 28px;
      text-align: center;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .room {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    button {
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--ivory);
      transition: transform 0.08s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: wait; }

    .ready {
      background: var(--charcoal-mid);
      border: 1px solid var(--charcoal-light);
      padding: 24px 20px;
      font-size: 19px;
      font-weight: 500;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ready:hover { background: var(--charcoal-light); }
    .ready small {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      white-space: nowrap;
      margin-left: 12px;
    }

    .urgent {
      background: transparent;
      border: 1px solid var(--alert-red);
      color: var(--alert-red);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 18px;
    }
    .urgent:hover { background: rgba(224, 92, 92, 0.12); }

    /* ── PIN gate ── */
    #gate {
      width: 100%;
      max-width: 360px;
      background: var(--charcoal-mid);
      border: 1px solid var(--charcoal-light);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #gate label { font-size: 13px; color: var(--text-dim); }
    #gate input {
      font-family: inherit;
      font-size: 22px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--charcoal-light);
      background: var(--charcoal);
      color: var(--ivory);
      outline: none;
    }
    #gate input:focus { border-color: var(--gold); }
    #gate button {
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--charcoal);
      font-weight: 600;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    /* ── toast ── */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--charcoal-mid);
      border: 1px solid var(--charcoal-light);
      border-left: 4px solid var(--gold);
      color: var(--ivory);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      max-width: calc(100% - 32px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok { border-left-color: var(--alert-green); }
    #toast.err { border-left-color: var(--alert-red); }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
    }
    .footer a { color: var(--text-dim); }
  </style>
</head>
<body>
  <h1>Treasury Aesthetics</h1>
  <div class="sub">Notify Dr. Latsky</div>

  <form id="gate" hidden autocomplete="off">
    <label for="pin">Enter the staff PIN once on this device</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••" required />
    <button type="submit">Unlock</button>
  </form>

  <div id="panel" class="panel" hidden></div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div class="footer">
    Room name only is sent — never patient details.<br />
    <a href="#" id="forget">Forget PIN on this device</a>
  </div>

  <script>
    const ROOMS = [
      { id: "room_1",           label: "Room 1" },
      { id: "room_2",           label: "Room 2" },
      { id: "room_3",           label: "Room 3" },
      { id: "aesthetics_suite", label: "Aesthetics Suite" },
    ];

    const PIN_KEY = "clinic_staff_pin";
    const gate = document.getElementById("gate");
    const panel = document.getElementById("panel");
    const toast = document.getElementById("toast");
    let toastTimer;

    const getPin = () => { try { return localStorage.getItem(PIN_KEY) || ""; } catch { return ""; } };
    const setPin = (v) => { try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch {} };

    function showToast(msg, kind) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.className = "show " + kind;
      toastTimer = setTimeout(() => (toast.className = ""), 3500);
    }

    function render() {
      const unlocked = Boolean(getPin());
      gate.hidden = unlocked;
      panel.hidden = !unlocked;
      if (!unlocked) { document.getElementById("pin").focus(); return; }

      panel.innerHTML = "";
      ROOMS.forEach((room) => {
        const row = document.createElement("div");
        row.className = "room";

        const ready = document.createElement("button");
        ready.className = "ready";
        ready.innerHTML = `<span>${room.label}</span><small>Patient ready</small>`;
        ready.onclick = () => send(room, "single", [ready, urgent]);

        const urgent = document.createElement("button");
        urgent.className = "urgent";
        urgent.textContent = "Urgent";
        urgent.onclick = () => send(room, "double", [ready, urgent]);

        row.append(ready, urgent);
        panel.appendChild(row);
      });
    }

    async function send(room, clickType, buttons) {
      buttons.forEach((b) => (b.disabled = true));
      try {
        const r = await fetch("/api/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Staff-PIN": getPin() },
          body: JSON.stringify({ roomId: room.id, clickType }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) {
          setPin("");
          showToast("PIN rejected — please enter it again", "err");
          render();
          return;
        }
        if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
        showToast(`Sent — ${room.label}${clickType === "double" ? " (urgent)" : ""}`, "ok");
        if (navigator.vibrate) navigator.vibrate(60);
      } catch (err) {
        showToast(err.message || "Could not send", "err");
      } finally {
        buttons.forEach((b) => (b.disabled = false));
      }
    }

    gate.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("pin").value.trim();
      if (!v) return;
      setPin(v);
      document.getElementById("pin").value = "";
      render();
    });

    document.getElementById("forget").addEventListener("click", (e) => {
      e.preventDefault();
      setPin("");
      render();
    });

    render();
  </script>
</body>
</html>
