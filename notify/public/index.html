<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1C1C1E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Treasury Medical — Notify a Physician</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8D5A3;
      --gold-dim: #8a6f30;
      --charcoal: #1C1C1E;
      --charcoal-mid: #2C2C2E;
      --charcoal-light: #3A3A3C;
      --ivory: #F5F0E8;
      --alert-red: #E05C5C;
      --alert-green: #5CB87A;
      --text-dim: #9A9087;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--charcoal);
      color: var(--ivory);
      min-height: 100vh;
      padding: 28px 16px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 29px;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      text-align: center;
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 6px 0 0;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 26px 0 18px;
    }

    /* ── metallic doctor plates ── */
    .plate {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      min-height: 96px;
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid var(--edge);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.09s ease, box-shadow 0.2s ease, filter 0.2s ease;
      /* fine brushed grain + polished horizon bands + the colour itself */
      background:
        repeating-linear-gradient(90deg,
          rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px,
          rgba(0,0,0,0.05) 1px, rgba(0,0,0,0.05) 2px),
        linear-gradient(180deg,
          rgba(255,255,255,0.68) 0%,
          rgba(255,255,255,0.20) 12%,
          rgba(255,255,255,0.00) 30%,
          rgba(0,0,0,0.00) 45%,
          rgba(0,0,0,0.30) 50%,
          rgba(0,0,0,0.08) 57%,
          rgba(255,255,255,0.10) 86%,
          rgba(255,255,255,0.32) 100%),
        linear-gradient(180deg,
          var(--m-light) 0%,
          var(--m-base) 38%,
          var(--m-dark) 62%,
          var(--m-base) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.70),
        inset 0 -1px 0 rgba(255,255,255,0.22),
        inset 0 -3px 9px rgba(0,0,0,0.34),
        0 8px 20px rgba(0,0,0,0.45);
    }

    /* specular highlight sweeping across the metal */
    .plate::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(100deg,
        transparent 56%,
        rgba(255,255,255,0.26) 67%,
        rgba(255,255,255,0.05) 71%,
        transparent 77%);
    }

    .plate > * { position: relative; z-index: 1; }

    .plate:hover { filter: brightness(1.06); }
    .plate:active { transform: scale(0.985); box-shadow: inset 0 2px 8px rgba(0,0,0,0.42), 0 3px 10px rgba(0,0,0,0.35); }
    .plate:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }
    .plate:disabled { cursor: wait; filter: saturate(0.55) brightness(0.86); transform: none; }

    .plate .who {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      text-shadow: var(--ink-shadow);
    }

    .plate .cap {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      opacity: 0.86;
      text-shadow: var(--ink-shadow);
    }

    .plate.sent {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        inset 0 -2px 7px rgba(0,0,0,0.32),
        0 0 0 3px var(--alert-green),
        0 8px 20px rgba(0,0,0,0.42);
    }
    .plate.failed {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.55),
        inset 0 -2px 7px rgba(0,0,0,0.32),
        0 0 0 3px var(--alert-red),
        0 8px 20px rgba(0,0,0,0.42);
    }

    /* per-doctor metal colours — ink chosen for contrast on each */
    .latsky {
      --m-light: #FFD9E8; --m-base: #E0709F; --m-dark: #93315C;
      --edge: #FFC2DA; --ink: #1C1C1E; --ink-shadow: 0 1px 0 rgba(255,255,255,0.40);
    }
    .tom {
      --m-light: #FF9C90; --m-base: #C4322A; --m-dark: #6E1710;
      --edge: #FF8F82; --ink: #FFFFFF; --ink-shadow: 0 1px 3px rgba(0,0,0,0.55);
    }
    .baker {
      --m-light: #A9CEFF; --m-base: #2F63BF; --m-dark: #12305E;
      --edge: #9CC4FA; --ink: #FFFFFF; --ink-shadow: 0 1px 3px rgba(0,0,0,0.55);
    }
    .didonato {
      --m-light: #A6E5BC; --m-base: #257A42; --m-dark: #0E3F22;
      --edge: #97DCAF; --ink: #FFFFFF; --ink-shadow: 0 1px 3px rgba(0,0,0,0.55);
    }

    /* ── PIN gate ── */
    #gate {
      width: 100%;
      max-width: 340px;
      background: var(--charcoal-mid);
      border: 1px solid var(--charcoal-light);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin: 40px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #gate label { font-size: 13px; color: var(--text-dim); }
    #gate input {
      font-family: inherit;
      font-size: 22px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--charcoal-light);
      background: var(--charcoal);
      color: var(--ivory);
      outline: none;
    }
    #gate input:focus { border-color: var(--gold); }
    #gate button {
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--charcoal);
      font-weight: 600;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .footer {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.7;
      margin-top: 6px;
    }
    .footer a { color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <h1>Treasury Medical</h1>
    <div class="sub">Notify a Physician</div>
  </header>

  <form id="gate" hidden autocomplete="off">
    <label for="pin">Enter the staff PIN once on this device</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••" required />
    <button type="submit">Unlock</button>
  </form>

  <main id="panel" hidden></main>

  <div class="footer">
    Only the doctor you tap is notified.<br />
    No patient details are ever sent.<br />
    <a href="#" id="forget">Forget PIN on this device</a>
  </div>

  <script>
    const DOCTORS = [
      { key: "latsky",   name: "Dr. Latsky" },
      { key: "tom",      name: "Dr. Tom" },
      { key: "baker",    name: "Dr. Baker" },
      { key: "didonato", name: "Dr. Di Donato" },
    ];

    const PIN_KEY = "clinic_staff_pin";
    const gate = document.getElementById("gate");
    const panel = document.getElementById("panel");

    const getPin = () => { try { return localStorage.getItem(PIN_KEY) || ""; } catch { return ""; } };
    const setPin = (v) => { try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch {} };

    function render() {
      const unlocked = Boolean(getPin());
      gate.hidden = unlocked;
      panel.hidden = !unlocked;
      if (!unlocked) { document.getElementById("pin").focus(); return; }

      panel.innerHTML = "";
      DOCTORS.forEach((doc) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "plate " + doc.key;
        btn.setAttribute("aria-label", "Notify " + doc.name);

        const who = document.createElement("span");
        who.className = "who";
        who.textContent = doc.name;

        const cap = document.createElement("span");
        cap.className = "cap";
        cap.textContent = "Tap to notify";

        btn.append(who, cap);
        btn.addEventListener("click", () => notify(doc, btn, cap));
        panel.appendChild(btn);
      });
    }

    async function notify(doc, btn, cap) {
      clearTimeout(btn.resetTimer);
      btn.disabled = true;
      btn.classList.remove("sent", "failed");
      cap.textContent = "Sending…";
      try {
        const r = await fetch("/api/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Staff-PIN": getPin() },
          body: JSON.stringify({ doctor: doc.key }),
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) {
          setPin("");
          render();
          return;
        }
        if (!r.ok) throw new Error(data.error || "Error " + r.status);
        btn.classList.add("sent");
        cap.textContent = "✓ Notified · " + data.time;
        if (navigator.vibrate) navigator.vibrate(80);
      } catch (err) {
        btn.classList.add("failed");
        cap.textContent = err.message || "Could not send";
      } finally {
        btn.disabled = false;
        btn.resetTimer = setTimeout(() => {
          btn.classList.remove("sent", "failed");
          cap.textContent = "Tap to notify";
        }, 8000);
      }
    }

    gate.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("pin").value.trim();
      if (!v) return;
      setPin(v);
      document.getElementById("pin").value = "";
      render();
    });

    document.getElementById("forget").addEventListener("click", (e) => {
      e.preventDefault();
      setPin("");
      render();
    });

    render();
  </script>
</body>
</html>
