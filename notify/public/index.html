<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1C1C1E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Treasury Medical — Notify Dr. Latsky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8D5A3;
      --gold-dim: #8a6f30;
      --charcoal: #1C1C1E;
      --charcoal-mid: #2C2C2E;
      --charcoal-light: #3A3A3C;
      --ivory: #F5F0E8;
      --alert-red: #E05C5C;
      --alert-green: #5CB87A;
      --text-dim: #9A9087;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--charcoal);
      color: var(--ivory);
      min-height: 100vh;
      padding: 32px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 30px;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      text-align: center;
    }

    .sub {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 6px 0 0;
      text-align: center;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 24px 0;
    }

    /* ── the one button ── */
    #call {
      width: min(78vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.10), transparent 55%),
        linear-gradient(160deg, var(--gold) 0%, var(--gold-dim) 100%);
      color: var(--charcoal);
      font-family: inherit;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.25;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow:
        0 0 0 10px rgba(201, 168, 76, 0.10),
        0 0 0 22px rgba(201, 168, 76, 0.05),
        0 18px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.1s ease, box-shadow 0.2s ease, filter 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #call .icon { font-size: 44px; line-height: 1; }
    #call small {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      opacity: 0.8;
    }
    #call:hover { filter: brightness(1.05); }
    #call:active { transform: scale(0.96); }
    #call:disabled { filter: saturate(0.4) brightness(0.8); cursor: wait; transform: none; }

    #call.sent {
      background: linear-gradient(160deg, var(--alert-green), #3e8a58);
      border-color: var(--alert-green);
      color: var(--ivory);
      box-shadow:
        0 0 0 10px rgba(92, 184, 122, 0.14),
        0 0 0 22px rgba(92, 184, 122, 0.06),
        0 18px 40px rgba(0, 0, 0, 0.45);
    }

    #status {
      min-height: 22px;
      font-size: 15px;
      text-align: center;
      color: var(--text-dim);
      transition: color 0.2s ease;
    }
    #status.ok { color: var(--alert-green); }
    #status.err { color: var(--alert-red); }

    /* ── PIN gate ── */
    #gate {
      width: 100%;
      max-width: 340px;
      background: var(--charcoal-mid);
      border: 1px solid var(--charcoal-light);
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #gate label { font-size: 13px; color: var(--text-dim); }
    #gate input {
      font-family: inherit;
      font-size: 22px;
      letter-spacing: 0.3em;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--charcoal-light);
      background: var(--charcoal);
      color: var(--ivory);
      outline: none;
    }
    #gate input:focus { border-color: var(--gold); }
    #gate button {
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: var(--charcoal);
      font-weight: 600;
      padding: 14px;
      font-size: 15px;
      letter-spacing: 0.06em;
    }

    .footer {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.7;
    }
    .footer a { color: var(--text-dim); }
  </style>
</head>
<body>
  <header>
    <h1>Treasury Medical</h1>
    <div class="sub">Notify Dr. Latsky</div>
  </header>

  <main>
    <form id="gate" hidden autocomplete="off">
      <label for="pin">Enter the staff PIN once on this device</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••" required />
      <button type="submit">Unlock</button>
    </form>

    <button id="call" hidden type="button" aria-label="Notify Dr. Latsky">
      <span class="icon">🔔</span>
      <span>Notify<br />Dr. Latsky</span>
      <small>Tap once</small>
    </button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <div class="footer">
    Sends a "you're needed" alert to Dr. Latsky's phone.<br />
    No patient details are ever sent.<br />
    <a href="#" id="forget">Forget PIN on this device</a>
  </div>

  <script>
    const PIN_KEY = "clinic_staff_pin";
    const gate = document.getElementById("gate");
    const call = document.getElementById("call");
    const status = document.getElementById("status");
    let resetTimer;

    const getPin = () => { try { return localStorage.getItem(PIN_KEY) || ""; } catch { return ""; } };
    const setPin = (v) => { try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch {} };

    function setStatus(msg, kind) {
      status.textContent = msg;
      status.className = kind || "";
    }

    function render() {
      const unlocked = Boolean(getPin());
      gate.hidden = unlocked;
      call.hidden = !unlocked;
      setStatus("");
      if (!unlocked) document.getElementById("pin").focus();
    }

    async function notify() {
      clearTimeout(resetTimer);
      call.disabled = true;
      setStatus("Sending…");
      try {
        const r = await fetch("/api/notify", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Staff-PIN": getPin() },
          body: JSON.stringify({}),
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) {
          setPin("");
          render();
          setStatus("PIN rejected — please enter it again", "err");
          return;
        }
        if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
        call.classList.add("sent");
        setStatus(`Sent — Dr. Latsky has been notified (${data.time})`, "ok");
        if (navigator.vibrate) navigator.vibrate(80);
        resetTimer = setTimeout(() => { call.classList.remove("sent"); setStatus(""); }, 6000);
      } catch (err) {
        setStatus(err.message || "Could not send", "err");
      } finally {
        call.disabled = false;
      }
    }

    call.addEventListener("click", notify);

    gate.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("pin").value.trim();
      if (!v) return;
      setPin(v);
      document.getElementById("pin").value = "";
      render();
    });

    document.getElementById("forget").addEventListener("click", (e) => {
      e.preventDefault();
      setPin("");
      render();
    });

    render();
  </script>
</body>
</html>
